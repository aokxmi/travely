<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Planner</title>
    <meta name="description" content="Tell it where you're going, for how many days, how much you can spend and what you enjoy. Get a claymorphic day-by-day plan with budget tracking." />
    <meta property="og:title" content="Trip Planner" />
    <meta property="og:description" content="Tell it where you're going, for how many days, how much you can spend and what you enjoy. Get a claymorphic day-by-day plan with budget tracking." />
    <script>
      // Suppress benign WebSocket/HMR transport errors in iframe environment
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport') || event.message.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
